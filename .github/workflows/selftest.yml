# restoreproof's self-test, on GitHub's own runners: the workflow `restoreproof init` writes, run
# against a synthetic database, weekly and on demand.
#
# Generated by src/selftest.ts from the workflow init writes, so do not edit it here: its first
# check fails when this file is not what init writes today. The only change to init's lines is that
# each `secrets.NAME` is a test value written in the open, since the database is a throwaway
# postgres:17 service container loaded with examples/synthetic-source.sql (shaped like a small
# Supabase project; no one's data) and the bucket an S3 mock (motoserver/moto:5.2.3) beside it.
# None of them is a secret. Besides GitHub it reaches Docker Hub for the two images, and apt for
# PostgreSQL, as init's workflow does.
#
#   restore-test   init's job: probe, install the server's major, back up, restore into a
#                  throwaway copy, compare, encrypt, keep the artifact, copy it to the bucket,
#                  keep the facts. Then read the backup back, decrypted, and from the bucket.
#   fetch-backup   gh run download the encrypted artifact, check it, decrypt it
#   restore-fails  the same source with uuid-ossp withheld from the copy: passes only when
#                  the drill exits 1 and reports RESTORE_FAILED, as a failing run does
name: selftest

on:
  schedule:
    - cron: "41 5 * * 2" # Tuesdays 05:41 UTC
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: selftest
  cancel-in-progress: false

jobs:
  restore-test:
    services:
      source:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: selftest
          POSTGRES_DB: source
        ports:
          - "15432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d source" --health-interval 5s --health-timeout 5s
          --health-retries 30
      s3:
        image: motoserver/moto:5.2.3
        ports:
          - "15000:5000"
    outputs:
      sealed_sha256: ${{ steps.readback.outputs.sha256 }}
    # below, init's job line for line, with the self-test's own steps (Self-test: ...) around its steps
    name: Back up, restore and compare
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      RESTOREPROOF_DATABASE_URL: ${{ 'postgresql://postgres:selftest@127.0.0.1:15432/source?sslmode=disable' }}
      RESTOREPROOF_PROVIDER: auto # auto, supabase, neon or postgres
      RESTOREPROOF_MAX_ROW_DRIFT: "10" # % a table's restored rows may differ from its live count
      RESTOREPROOF_MAX_SHRINK: "50" # % fewer live rows than at the last good run that fails the test
      RESTOREPROOF_EXCLUDE_SCHEMAS: "" # schemas to leave out of the backup, comma-separated
      RESTOREPROOF_S3_URL: ${{ 's3://restoreproof-selftest/backups' }}
    steps:
      - name: "Self-test: check out this repository beside the workspace"
        uses: actions/checkout@v7
        with:
          path: selftest
          persist-credentials: false

      - name: "Self-test: this file is what init writes, and so is the drill"
        run: |
          git init -q "$RUNNER_TEMP/customer"
          node selftest/dist/cli.js init "$RUNNER_TEMP/customer"
          node selftest/scripts/selftest.mjs "$RUNNER_TEMP/customer" selftest

      - name: "Self-test: load the synthetic database into the source"
        env:
          SOURCE: ${{ job.services.source.id }}
        run: |
          docker exec -i "$SOURCE" psql -X -q -v ON_ERROR_STOP=1 -U postgres -d source < selftest/examples/synthetic-source.sql
          echo "Loaded examples/synthetic-source.sql into a postgres:17 service container."

      - name: "Self-test: make the bucket"
        env:
          AWS_ACCESS_KEY_ID: selftest-access-key-id
          AWS_SECRET_ACCESS_KEY: selftest-secret-access-key
          AWS_DEFAULT_REGION: us-east-1
        run: |
          for i in $(seq 1 30); do
            if aws --endpoint-url http://127.0.0.1:15000 s3 mb s3://restoreproof-selftest; then exit 0; fi
            sleep 2
          done
          exit 1

      - name: Check out the drill
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/restoreproof
          persist-credentials: false

      - name: Read the last good run's facts and the repository's visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "RESTOREPROOF_VISIBILITY=$(gh repo view "$GITHUB_REPOSITORY" --json visibility --jq .visibility || echo UNKNOWN)" >> "$GITHUB_ENV"
          workflow=$(basename "${GITHUB_WORKFLOW_REF%%@*}")
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty' || true)
          if [ -n "$run" ]; then
            gh run download "$run" --repo "$GITHUB_REPOSITORY" --name restoreproof-facts --dir "$RUNNER_TEMP/previous" || echo "Run $run kept no facts."
          else
            echo "No earlier successful run: nothing to compare with yet."
          fi

      - name: Read the database's PostgreSQL version
        id: probe
        run: node .github/restoreproof/drill.mjs probe

      - name: Install PostgreSQL ${{ steps.probe.outputs.major }} from the PostgreSQL apt repository
        env:
          PACKAGES: ${{ steps.probe.outputs.packages }}
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends $PACKAGES

      - name: Back up, restore into a throwaway copy, compare
        id: drill
        env:
          RESTOREPROOF_PG_BIN: /usr/lib/postgresql/${{ steps.probe.outputs.major }}/bin
          RESTOREPROOF_PREVIOUS: ${{ runner.temp }}/previous/facts.json
          RESTOREPROOF_OUT: ${{ runner.temp }}/restoreproof
        run: node .github/restoreproof/drill.mjs drill

      - name: Encrypt the backup, or refuse to publish it
        id: seal
        if: ${{ !cancelled() && steps.drill.outputs.backup != '' }}
        env:
          BACKUP: ${{ steps.drill.outputs.backup }}
          RESTOREPROOF_PASSPHRASE: ${{ 'selftest-passphrase-not-a-secret' }}
        run: |
          file="$BACKUP"
          if [ -n "$RESTOREPROOF_PASSPHRASE" ]; then
            gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --symmetric --cipher-algo AES256 --output "$BACKUP.gpg" "$BACKUP" <<< "$RESTOREPROOF_PASSPHRASE"
            rm -f "$BACKUP"
            file="$BACKUP.gpg"
            echo "Encrypted. To read it: gpg --decrypt --output backup.dump $(basename "$file")"
          fi
          echo "file=$file" >> "$GITHUB_OUTPUT"
          if [ -n "$RESTOREPROOF_PASSPHRASE" ] || [ "$RESTOREPROOF_VISIBILITY" = "PRIVATE" ] || [ "$RESTOREPROOF_VISIBILITY" = "INTERNAL" ]; then
            echo "artifact=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$RESTOREPROOF_S3_URL" ]; then
            echo "This repository is $RESTOREPROOF_VISIBILITY: the unencrypted backup goes to your bucket only, not to the run's artifacts."
          else
            echo "::error title=restoreproof::This repository is $RESTOREPROOF_VISIBILITY, and anyone who can read it can download a run's artifacts. Add the RESTOREPROOF_PASSPHRASE secret to encrypt the backup, or a bucket (RESTOREPROOF_S3_URL)."
            exit 1
          fi

      - name: Keep the backup as an artifact
        if: ${{ !cancelled() && steps.seal.outputs.artifact == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: restoreproof-backup-${{ github.run_number }}
          path: ${{ steps.seal.outputs.file }}
          retention-days: 28
          compression-level: 0
          if-no-files-found: error

      - name: Copy the backup to your bucket
        if: ${{ !cancelled() && steps.seal.outputs.file != '' && env.RESTOREPROOF_S3_URL != '' }}
        env:
          FILE: ${{ steps.seal.outputs.file }}
          S3_ENDPOINT: ${{ 'http://127.0.0.1:15000' }}
          AWS_ACCESS_KEY_ID: ${{ 'selftest-access-key-id' }}
          AWS_SECRET_ACCESS_KEY: ${{ 'selftest-secret-access-key' }}
          AWS_DEFAULT_REGION: ${{ '' || ('http://127.0.0.1:15000' && 'auto') || 'us-east-1' }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          key="${RESTOREPROOF_S3_URL%/}/$(date -u +%Y%m%dT%H%MZ)-run$GITHUB_RUN_NUMBER-$(basename "$FILE")"
          args=()
          if [ -n "$S3_ENDPOINT" ]; then args+=(--endpoint-url "$S3_ENDPOINT"); fi
          aws s3 cp "${args[@]}" --only-show-errors "$FILE" "$key"
          echo "Copied the backup to your bucket."

      - name: Keep the facts (counts and hashes, no data)
        if: ${{ !cancelled() && steps.drill.outputs.facts != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: restoreproof-facts
          path: ${{ steps.drill.outputs.facts }}
          retention-days: 90
          if-no-files-found: ignore

      - name: "Self-test: the backup decrypts to an archive of every table, and the bucket has it"
        id: readback
        env:
          FILE: ${{ steps.seal.outputs.file }}
          TABLES: ${{ steps.drill.outputs.tables }}
          PG_BIN: /usr/lib/postgresql/${{ steps.probe.outputs.major }}/bin
          PASSPHRASE: selftest-passphrase-not-a-secret
          AWS_ACCESS_KEY_ID: selftest-access-key-id
          AWS_SECRET_ACCESS_KEY: selftest-secret-access-key
          AWS_DEFAULT_REGION: us-east-1
        run: |
          case "$FILE" in *.gpg) ;; *) echo "::error title=selftest::the backup was not encrypted: $FILE"; exit 1 ;; esac
          gpg --batch --pinentry-mode loopback --passphrase-fd 0 --decrypt --output "$RUNNER_TEMP/readback.dump" "$FILE" <<< "$PASSPHRASE"
          data=$("$PG_BIN/pg_restore" --list "$RUNNER_TEMP/readback.dump" | grep -c " TABLE DATA ")
          echo "Decrypted: a pg_dump archive with the data of $data tables; the drill compared $TABLES."
          if [ "$data" != "$TABLES" ]; then echo "::error title=selftest::the archive holds $data tables' data, the drill compared $TABLES"; exit 1; fi
          aws --endpoint-url http://127.0.0.1:15000 s3 cp --recursive --only-show-errors s3://restoreproof-selftest/backups/ "$RUNNER_TEMP/bucket"
          copies=("$RUNNER_TEMP"/bucket/*)
          if [ "${#copies[@]}" != 1 ]; then echo "::error title=selftest::the bucket holds ${#copies[@]} files, not one backup"; exit 1; fi
          echo "In the bucket: $(basename "${copies[0]}")"
          cmp "${copies[0]}" "$FILE"
          echo "sha256=$(sha256sum "$FILE" | cut -d " " -f 1)" >> "$GITHUB_OUTPUT"
          {
            echo "### Self-test"
            echo
            echo "- The backup decrypts with the passphrase to a pg_dump archive holding the data of $data tables, every table the drill compared."
            echo "- The bucket holds the same encrypted file, byte for byte."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Self-test: the last good run's facts were fetched, when there was one"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          workflow=$(basename "${GITHUB_WORKFLOW_REF%%@*}")
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$run" ]; then
            line="No earlier good run of $workflow, so these facts are the first: the next run fetches them with gh run download."
          elif [ -s "$RUNNER_TEMP/previous/facts.json" ]; then
            line="The facts of run $run, the last good one, were fetched with gh run download and compared."
          else
            echo "::error title=selftest::run $run passed, but its facts were not fetched"
            exit 1
          fi
          echo "$line"
          echo "- $line" >> "$GITHUB_STEP_SUMMARY"

  fetch-backup:
    name: Fetch the backup with gh run download, and decrypt it
    needs: restore-test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: "Self-test: fetch, check and decrypt the encrypted backup"
        env:
          GH_TOKEN: ${{ github.token }}
          SHA256: ${{ needs.restore-test.outputs.sealed_sha256 }}
          PASSPHRASE: selftest-passphrase-not-a-secret
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "restoreproof-backup-$GITHUB_RUN_NUMBER" --dir "$RUNNER_TEMP/backup"
          file=$(ls "$RUNNER_TEMP"/backup/*.gpg)
          got=$(sha256sum "$file" | cut -d " " -f 1)
          if [ "$got" != "$SHA256" ]; then echo "::error title=selftest::$file has sha256 $got; the first job sealed $SHA256"; exit 1; fi
          gpg --batch --pinentry-mode loopback --passphrase-fd 0 --decrypt --output "$RUNNER_TEMP/backup.dump" "$file" <<< "$PASSPHRASE"
          if [ "$(head -c 5 "$RUNNER_TEMP/backup.dump")" != PGDMP ]; then echo "::error title=selftest::the decrypted file is not a pg_dump archive"; exit 1; fi
          line="The artifact restoreproof-backup-$GITHUB_RUN_NUMBER came back through gh run download as the file the first job sealed, and decrypts to a pg_dump archive."
          echo "$line"
          echo "- $line" >> "$GITHUB_STEP_SUMMARY"

  restore-fails:
    name: A backup that does not restore fails with RESTORE_FAILED
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      source:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: selftest
          POSTGRES_DB: source
        ports:
          - "15432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d source" --health-interval 5s --health-timeout 5s
          --health-retries 30
    defaults:
      run:
        shell: bash
    env:
      RESTOREPROOF_DATABASE_URL: ${{ 'postgresql://postgres:selftest@127.0.0.1:15432/source?sslmode=disable' }}
      RESTOREPROOF_PROVIDER: auto # auto, supabase, neon or postgres
      RESTOREPROOF_MAX_ROW_DRIFT: "10" # % a table's restored rows may differ from its live count
      RESTOREPROOF_MAX_SHRINK: "50" # % fewer live rows than at the last good run that fails the test
      RESTOREPROOF_EXCLUDE_SCHEMAS: "" # schemas to leave out of the backup, comma-separated
      RESTOREPROOF_S3_URL: ${{ 's3://restoreproof-selftest/backups' }}
    steps:
      - name: "Self-test: check out this repository beside the workspace"
        uses: actions/checkout@v7
        with:
          path: selftest
          persist-credentials: false

      - name: "Self-test: load the synthetic database into the source"
        env:
          SOURCE: ${{ job.services.source.id }}
        run: |
          docker exec -i "$SOURCE" psql -X -q -v ON_ERROR_STOP=1 -U postgres -d source < selftest/examples/synthetic-source.sql
          echo "Loaded examples/synthetic-source.sql into a postgres:17 service container."

      - name: Check out the drill
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/restoreproof
          persist-credentials: false

      - name: Read the database's PostgreSQL version
        id: probe
        run: node .github/restoreproof/drill.mjs probe

      - name: Install PostgreSQL ${{ steps.probe.outputs.major }} from the PostgreSQL apt repository
        env:
          PACKAGES: ${{ steps.probe.outputs.packages }}
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends $PACKAGES

      - name: "Self-test: with uuid-ossp withheld from the copy, the drill fails with RESTORE_FAILED"
        env:
          RESTOREPROOF_SKIP_EXTENSIONS: uuid-ossp
          RESTOREPROOF_PG_BIN: /usr/lib/postgresql/${{ steps.probe.outputs.major }}/bin
          RESTOREPROOF_OUT: ${{ runner.temp }}/restoreproof
        run: |
          got="$RUNNER_TEMP/expected-failure"
          mkdir -p "$got"
          touch "$got/output" "$got/summary.md"
          code=0
          GITHUB_OUTPUT="$got/output" GITHUB_STEP_SUMMARY="$got/summary.md" node .github/restoreproof/drill.mjs drill > "$got/stdout" 2> "$got/stderr" || code=$?
          # what the drill printed, shown with GitHub's commands off: its ::error is expected here
          token="selftest-$RANDOM$RANDOM"
          echo "::stop-commands::$token"
          cat "$got/stdout" "$got/stderr"
          echo "::$token::"
          fail() { echo "::error title=selftest::$1"; exit 1; }
          [ "$code" = 1 ] || fail "the drill exited $code, not 1"
          grep -qx "ok=false" "$got/output" || fail "the drill did not set ok=false"
          grep -q "^::error title=restoreproof RESTORE_FAILED::" "$got/stdout" || fail "the drill did not report RESTORE_FAILED"
          grep -q "did not restore" "$got/summary.md" || fail "the drill's summary does not say the backup did not restore"
          {
            echo "### Self-test: the failure path"
            echo
            echo "With uuid-ossp withheld from the copy, the drill exited 1 and reported RESTORE_FAILED, as it must. Its summary, as a failing run shows it:"
            echo
            sed "s/^/> /" "$got/summary.md"
          } >> "$GITHUB_STEP_SUMMARY"
